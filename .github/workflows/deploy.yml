
name: Tarbiyachi Pro - Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Next.js Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TARBIYACHI_PRO_FULL_PROJECT/tarbiyachi-pro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build
